<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Treinaseg Connectta</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-content { padding: 40px 5%; background-color: var(--fundo-claro); min-height: 60vh; text-align: center; }
        .contact-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .contact-box h2 { color: var(--azul-escuro); margin-bottom: 20px; }
        .contact-box p { color: var(--texto-cinza); margin-bottom: 30px; }
        .contact-info { margin-bottom: 30px; font-weight: bold; color: var(--verde-principal); }
        .btn-voltar { display: inline-block; margin-top: 20px; color: var(--texto-cinza); text-decoration: none; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-area">
            <img src="logo.png" alt="Brasão Treinaseg Connectta" class="site-logo">
            <p>CONECTANDO CONHECIMENTO,<br>PROMOVENDO SEGURANÇA.</p>
        </div>
        <div class="title-area">
            <h2>ENTRE EM <span>CONTATO</span></h2>
        </div>
        <div class="badges-area"></div>
    </header>

    <main class="page-content">
        <div class="contact-box">
            <h2>Fale com nossa equipe</h2>
            <p>Estamos prontos para tirar suas dúvidas e fechar parcerias.</p>
            
            <div class="contact-info">
                📧 contato@treinasegconnectta.com.br<br><br>
                📱 (34) 99999-9999
            </div>

        </div>
        
        <a href="index.html" class="btn-voltar">⬅ Voltar para o Login</a>
    </main>

</body>
</html>
