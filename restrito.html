<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito - Treinaseg Connectta</title>
    <link rel="stylesheet" href="style.css">
    <style>
    /* Reset básico para evitar erros */
    * { box-sizing: border-box; }

    .container-restrito {
        text-align: center;
        padding: 40px 20px; /* Reduzi o padding superior para telas menores */
        max-width: 90%;     /* Define que o container nunca ocupará mais de 90% da tela */
        margin: 0 auto;
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .icon-lock { font-size: 50px; margin-bottom: 20px; }
 h1 { 
        color: var(--azul-escuro); 
        font-size: 40px; /* Aumentado de 24px para 32px */
        margin-bottom: 15px;
    } 
    p { 
        color: var(--texto-cinza); 
        font-size: 26px; /* Aumentado de 16px para 18px */
        line-height: 1.6; /* Aumenta o espaço entre as linhas para facilitar a leitura */
        margin-bottom: 40px; 
    }
    
    .btn-contratar {
        display: inline-block;
        padding: 15px 25px;
        background-color: var(--verde-principal);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        width: 100%;       /* Botão ocupa toda a largura em celulares */
        max-width: 300px;  /* Mas não fica gigante em computadores */
    }
</style>
</head>
<body>
    <div class="container-restrito">
        <div class="icon-lock">🔒</div>
        <h1>Área Exclusiva para Assinantes</h1>
        <p>Este recurso está disponível apenas para parceiros e empresas com plano ativo na Treinaseg Connectta.</p>
        <a href="contato.html" class="btn-contratar">QUERO ASSINAR AGORA</a>
        <br><br>
        <a href="dashboard.html" style="color: var(--texto-cinza);">Voltar para o Dashboard</a>
    </div>
</body>
</html>
