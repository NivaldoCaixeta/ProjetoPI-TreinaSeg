<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Treinaseg Connectta</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--fundo-claro);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-box img {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .login-box h2 {
            color: var(--azul-escuro);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .login-box p {
            color: var(--texto-cinza);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-large {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-visitante {
            background-color: var(--verde-principal);
            color: white;
        }
        .btn-visitante:hover {
            background-color: var(--verde-claro);
            transform: translateY(-2px);
        }
        .btn-cliente {
            background-color: var(--azul-escuro);
            color: white;
        }
        .btn-cliente:hover {
            background-color: #0d2a4d;
            transform: translateY(-2px);
        }
        .login-footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--texto-cinza);
        }
        .login-footer a {
            color: var(--verde-principal);
            text-decoration: none;
            font-weight: bold;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="logo.png" alt="Brasão Treinaseg Connectta">
            <h2>Acesso à Plataforma</h2>
            <p>Explore como visitante para conhecer as soluções.</p>
            
            <!-- Leva para o Dashboard principal do sistema -->
            <a href="dashboard.html" class="btn-large btn-visitante">Testar como Visitante</a>
            
            
            <div class="login-footer">
                Ainda não possui uma conta? <a href="contato.html">Fale com a gente</a>
            </div>
        </div>
    </div>
</body>
</html>
